services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: security_services
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security -d security_services"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
