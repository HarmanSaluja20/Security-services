name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: security_services
          POSTGRES_USER: security
          POSTGRES_PASSWORD: security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security -d security_services"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/security_services
      SPRING_DATASOURCE_USERNAME: security
      SPRING_DATASOURCE_PASSWORD: security
      JWT_SECRET: ci-only-secret-value-with-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-placeholder-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle test bootJar --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: security-services-jar
          path: build/libs/*.jar
