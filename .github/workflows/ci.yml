name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: gradle test bootJar --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: security-services-jar
          path: build/libs/*.jar
